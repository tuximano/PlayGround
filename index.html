<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>BREACHLINE</title>
  <style>
    :html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,Helvetica,sans-serif;touch-action:none;user-select:none}
    :canvas{display:block;width:100%;height:100%}
    #ui{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 1px 2px #000}
    #top{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px}
    .team{font-size:12px;letter-spacing:2px;display:flex;gap:5px}.pip{width:8px;height:12px;background:#26303a;border:1px solid #6d7780}.pip.on.v{background:#e8a64b}.pip.on.d{background:#64aeb5}
    #score{text-align:center}.round{font-size:10px;letter-spacing:3px;color:#cbd1d4}.time{font-size:27px;font-weight:800;font-variant-numeric:tabular-nums}
    #map{position:absolute;left:14px;top:14px;width:150px;height:150px;border:1px solid rgba(255,255,255,.22);border-radius:50%;overflow:hidden;background:rgba(10,17,18,.72);backdrop-filter:blur(3px)}
    #map canvas{width:100%;height:100%}
    #objective{position:absolute;top:174px;left:24px;font-size:10px;color:#eab06b;letter-spacing:1px}
    #bottomLeft{position:absolute;left:20px;bottom:24px;width:210px}
    #healthRow{display:flex;align-items:flex-end;gap:7px}.hpNum{font-size:28px;font-weight:800}.hpbar{width:155px;height:7px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);margin-bottom:7px}.hpfill{height:100%;width:100%;background:#e8e1d1;transition:.2s}
    #armor{font-size:10px;color:#aebbc0;letter-spacing:1px;margin-top:-3px}
    #bottomRight{position:absolute;right:20px;bottom:22px;text-align:right}.ammo{font-size:28px;font-weight:800}.ammo span{font-size:12px;color:#aaa}.money{color:#dfb56c;font-size:14px;font-weight:bold;margin-top:3px}
    #slots{display:flex;justify-content:flex-end;gap:5px;margin-top:7px}.slot{width:31px;height:31px;border:1px solid rgba(255,255,255,.24);background:rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center;font-size:12px}
    #crosshair{position:absolute;left:50%;top:50%;width:10px;height:10px;transform:translate(-50%, -50%)}#crosshair:before,#crosshair:after{content:"";position:absolute;background:rgba(255,255,255,.9)}#crosshair:before{width:2px;height:10px;left:4px}#crosshair:after{height:2px;width:10px;top:4px}
    #hit{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%) scale(.5);border:3px solid #e8b15d;border-radius:50%;opacity:0;transition:.08s}#hit.show{opacity:.8;transform:translate(-50%,-50%) scale(1)}
    #notice{position:absolute;top:24%;left:50%;transform:translateX(-50%);font-size:16px;letter-spacing:4px;color:#e9dec9;font-weight:bold;opacity:0;transition:.25s}#notice.show{opacity:1}
    #start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(90deg,rgba(12,17,18,.92),rgba(12,17,18,.55));pointer-events:auto;text-align:center}
    #start.hide{display:none}.logo{font-size:48px;font-weight:900;letter-spacing:-3px;transform:scaleX(.86)}.logo i{color:#dca04e;font-style:normal}.sub{font-size:10px;letter-spacing:5px;margin:8px 0 28px;color:#afbbb9}.play{border:1px solid #d6a45d;color:#f2e1bd;background:rgba(196,147,75,.12);padding:14px 34px;font-weight:bold;letter-spacing:3px;font-size:12px;cursor:pointer}.play:active{background:#d6a45d;color:#171717}
    .controls{position:absolute;display:none;pointer-events:auto}#stick{left:24px;bottom:94px;width:110px;height:110px;border:1px solid rgba(255,255,255,.13);border-radius:50%;background:rgba(0,0,0,.12)}#knob{position:absolute;width:48px;height:48px;border-radius:50%;left:31px;top:31px;background:rgba(255,255,255,.16)}#fire{right:24px;bottom:110px;width:74px;height:74px;border:1px solid rgba(255,255,255,.22);border-radius:50%;background:rgba(190,110,65,.14);display:flex;align-items:center;justify-content:center}#reload{right:112px;bottom:82px;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.24);font-size:11px}#plant{right:112px;bottom:145px;width:48px;height:48px;border-radius:50%;border:1px solid #d8ac67;background:rgba(196,147,75,.18);font-size:10px}
    @media (pointer:coarse){.controls{display:flex}.controls#stick{display:block}.controls#reload,.controls#plant{align-items:center;justify-content:center}}
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="map"><canvas id="mapCanvas" width="150" height="150"></canvas></div><div id="objective">OBJETIVO / PONTO A &nbsp; PONTO B</div>
    <div id="top"><div class="team" id="aegis"></div><div id="score"><div class="round" id="round">ROUND 1 / 13</div><div class="time" id="time">1:35</div></div><div class="team" id="vanguard"></div></div>
    <div id="crosshair"></div><div id="hit"></div><div id="notice"></div>
    <div id="bottomLeft"><div id="healthRow"><div class="hpNum" id="hp">100</div><div class="hpbar"><div class="hpfill" id="hpfill"></div></div></div><div id="armor">◈ 100 &nbsp; ARMOR</div></div>
    <div id="bottomRight"><div class="ammo"><b id="ammo">30</b> <span>/ 90</span></div><div class="money" id="money">$800</div><div id="slots"><div class="slot">1</div><div class="slot">2</div><div class="slot">G</div><div class="slot">×</div></div></div>
    <div id="stick" class="controls"><div id="knob"></div></div><div id="fire" class="controls">●</div><div id="reload" class="controls">R</div><div id="plant" class="controls">E</div>
    <div id="start"><div class="logo">BREACH<span><i>LINE</i></span></div><div class="sub">TACTICAL 5V5 · DEfUSE</div><div class="play" id="play">ENTRAR NA OPERAÇÃO</div></div>
  </div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),mctx=document.getElementById('mapCanvas').getContext('2d');
let W,H,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const keys={},mouse={x:0,y:0,down:false};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('mousemove',e=>{if(game.running&&!game.mobile)game.yaw-=e.movementX*.0022});
canvas.addEventListener('mousedown',()=>{mouse.down=true;if(canvas.requestPointerLock)canvas.requestPointerLock()});addEventListener('mouseup',()=>mouse.down=false);
let game={running:false,mobile:matchMedia('(pointer:coarse)').matches,yaw:0,pitch:0,hp:100,ammo:30,reserve:90,money:800,round:1,time:95,bots:[],kills:0,plant:false};
const spots=[[-5,0],[5,-2],[-6,-7],[7,-8],[0,-11],[4,-13],[-8,-13]];
function resetBots(){game.bots=[];for(let i=0;i<5;i++){let s=spots[i];game.bots.push({x:s[0]+(Math.random()-2)*.8,y:s[1],hp:100,phase:Math.random()*6,alive:true,side:i<3?'d':'v'})}}
resetBots();
function makePips(){let a=document.getElementById('aegis'),v=document.getElementById('vanguard');a.innerHTML='AEGIS '+Array.from({length:5},(_,i)=>`<i class="pip d ${i<5?'on':''}"></i>`).join('');v.innerHTML=Array.from({length:5},(_,i)=>`<i class="pip v ${i<5?'on':''}"></i>`).join('')+' VANGUARD'}makePips();
let player={x:0,y:0,z:1.7,rx:0};
function notice(t){let n=document.getElementById('notice');n.textContent=t;n.classList.add('show');clearTimeout(notice.t);notice.t=setTimeout(()=>n.classList.remove('show'),1400)}
function worldProject(wx,wz){let dx=wx-player.x,dz=wz-player.y,cy=Math.cos(game.yaw),sy=Math.sin(game.yaw);let rx=dx*cy-dz*sy,rz=dx*sy+dz*cy;if(rz<.2)return null;let f=H*.9;return{x:W/2+(rx/rz)*f,y:H*.52-(player.z/rz)*f,s:Math.min(f/rz,220),d:rz}}
function wall(ctx,x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function drawWorld(){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#d6b180');sky.addColorStop(.48,'#9c9d8b');sky.addColorStop(.49,'#4d5854');sky.addColorStop(1,'#171b1a');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 // sun
 ctx.fillStyle='rgba(255,221,169,.55)';ctx.beginPath();ctx.arc(W*.78,H*.25,42,0,7);ctx.fill();
 // horizon buildings
 for(let i=-2;i<10;i++){let x=i*140-(game.yaw*30%140)-30,h=120+(i%3)*38;ctx.fillStyle=i%2?'#77776d':'#686b62';ctx.fillRect(x,H*.52-h,120,h);ctx.fillStyle='#414743';for(let yy=H*.52-h+18;yy<H*.52-12;yy+=32)for(let xx=x+12;xx<x+110;xx+=28)ctx.fillRect(xx,yy,9,13)}
 // floor
 let floor=ctx.createLinearGradient(0,H*.52,0,H);floor.addColorStop(0,'#707268');floor.addColorStop(1,'#292e2c');ctx.fillStyle=floor;ctx.fillRect(0,H*.52,W,H*.48);
 // perspective lane lines
 ctx.strokeStyle='rgba(35,38,36,.32)';ctx.lineWidth=1;for(let i=-8;i<=8;i++){ctx.beginPath();ctx.moveTo(W/2+i*5,H*.52);ctx.lineTo(W/2+i*W*.12,H);ctx.stroke()}for(let z=1;z<8;z++){let p=1/z;let y=H*.52+(H*.48)*(1-p);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 // poles and wires
 ctx.strokeStyle='#3b403d';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W*.12,-10);ctx.lineTo(W*.12,H*.66);ctx.moveTo(W*.88,-10);ctx.lineTo(W*.88,H*.66);ctx.stroke();ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(W*.12,H*.22);ctx.quadraticCurveTo(W*.5,H*.32,W*.88,H*.18);ctx.stroke();
 // walls / containers projected as blocks
 let objs=[[-9,-5,4,3,'#50554f'],[9,-6,5,3,'#62675f'],[-7,-11,3,3,'#8a7257'],[7,-12,4,3,'#5f6c68']];for(let o of objs){let p=worldProject(o[0],o[1]);if(p){ctx.fillStyle=o[4];ctx.fillRect(p.x-p.s*.6,p.y-p.s*.8,p.s*o[2],p.s*o[3]);ctx.fillStyle='rgba(25,30,28,.28)';for(let x=p.x-p.s*.55;x<p.x+p.s*.5;x+=p.s*.45)ctx.fillRect(x,p.y-p.s*.7,2,p.s*2)}}
 // objective A/B markers
 for(let o of [[-5,-9,'A','245,170,95'],[5,-10,'B','100,170,175']]){let p=worldProject(o[0],o[1]);if(p){ctx.strokeStyle=`rgba(${o[3]},.7)`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y-p.s*.2,p.s*.45,0,7);ctx.stroke();ctx.fillStyle=`rgba(${o[3]},.9)`;ctx.font=`bold ${Math.max(12,p.s*.25)}px Arial`;ctx.fillText(o[2],p.x-5,p.y-p.s*.2+5)}}
 // bots sorted depth
 let visible=game.bots.filter(b=>b.alive).map(b=>({b,p:worldProject(b.x,b.y)})).filter(v=>v.p).sort((a,b)=>b.p.d-a.p.d);
 for(let v of visible){let p=v.p,b=v.b;let s=p.s*.34;if(s<3)continue;ctx.fillStyle='#1e2625';ctx.fillRect(p.x-s*.38,p.y-s*.95,s*.76,s*.95);ctx.fillStyle='#d0c5b1';ctx.beginPath();ctx.arc(p.x,p.y-s*1.05,s*.22,0,7);ctx.fill();ctx.fillStyle='#6f7772';ctx.fillRect(p.x-s*.55,p.y-s*.85,s*.18,s*.55);ctx.fillRect(p.x+s*.37,p.y-s*.85,s*.18,s*.55);ctx.fillStyle='#ac6e51';ctx.fillRect(p.x+s*.2,p.y-s*.55,s*.55,s*.08);}
 // weapon view
 let recoil=(30-game.ammo)*.7;ctx.save();ctx.translate(W*.56,H*.78);ctx.rotate(-.06);ctx.fillStyle='#171b1a';ctx.fillRect(-38,-32-recoil,220,48);ctx.fillStyle='#242a29';ctx.fillRect(-18,-38-recoil,145,24);ctx.fillStyle='#777c76';ctx.fillRect(50,-34-recoil,220,8);ctx.fillStyle='#0d1010';ctx.fillRect(126,-30-recoil,90,6);ctx.restore();
}
function drawMap(){mctx.clearRect(0,0,150,150);mctx.save();mctx.translate(75,75);mctx.fillStyle='rgba(190,200,190,.13)';mctx.beginPath();mctx.moveTo(-28,-55);mctx.lineTo(35,-48);mctx.lineTo(48,20);mctx.lineTo(-10,52);mctx.lineTo(-48,10);mctx.closePath();mctx.fill();mctx.strokeStyle='rgba(220,225,215,.32)';mctx.lineWidth=2;mctx.stroke();mctx.rotate(-game.yaw);mctx.fillStyle='#e3dfce';mctx.beginPath();mctx.moveTo(0,-7);mctx.lineTo(5,6);mctx.lineTo(0,3);mctx.lineTo(-5,6);mctx.closePath();mctx.fill();mctx.fillStyle='#e0a35d';mctx.beginPath();mctx.arc(-26,-20,3,0,7);mctx.fill();mctx.fillStyle='#70aeb2';mctx.beginPath();mctx.arc(26,-24,3,0,7);mctx.fill();mctx.restore();}
function update(dt){if(!game.running)return;if(!game.mobile){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);let sp=(keys.shift?2.1:3.6)*dt;player.x+=(-Math.sin(game.yaw)*dx+Math.cos(game.yaw)*dy)*sp;player.y+=(Math.cos(game.yaw)*dx+Math.sin(game.yaw)*dy)*sp}else if(stick.active){player.x+=(-Math.sin(game.yaw)*stick.dx+Math.cos(game.yaw)*stick.dy)*3.2*dt;player.y+=(Math.cos(game.yaw)*stick.dx+Math.sin(game.yaw)*stick.dy)*3.2*dt}player.x=Math.max(-11,Math.min(11,player.x));player.y=Math.max(-14,Math.min(1,player.y));
 game.time-=dt;if(game.time<=0){roundOver(false)}
 for(let b of game.bots){if(!b.alive)continue;b.phase+=dt*.8;let dx=player.x-b.x,dz=player.y-b.y,d=Math.hypot(dx,dz);if(d<9){b.x+=Math.sign(dx)*dt*.35;b.y+=Math.sign(dz)*dt*.35;if(d<6&&Math.random()<dt*.18){game.hp-=4+Math.random()*5;updateHud();if(game.hp<=0)roundOver(false)}}else if(Math.abs(b.phase%4)<.1){b.x+=(player.x-b.x)*dt*.12;b.y+=(player.y-b.y)*dt*.12}}
 if(mouse.down||touchFire)shoot();}
let last=0,shootCd=0;
function shoot(){if(performance.now()-shootCd<115)return;shootCd=performance.now();if(game.ammo<=0){reload();return}game.ammo--;updateHud();let spread=.03+(Math.abs(keys.w||0)+Math.abs(keys.s||0))*0.08;let closest=null,best=999;for(let b of game.bots){if(!b.alive)continue;let dx=b.x-player.x,dz=b.y-player.y,ang=Math.atan2(dx,dz)-game.yaw;if(Math.abs(ang)>Math.PI)ang-=Math.sign(ang)*Math.PI*2;if(Math.abs(ang)<.13){let d=Math.hypot(dx,dz);if(d<best){best=d;closest=b}}}if(closest&&Math.random()>.09){closest.hp-=70+Math.random()*25;if(closest.hp<=0){closest.alive=false;game.kills++;game.money+=300;notice('ELIMINAÇÃO');}let h=document.getElementById('hit');h.classList.add('show');setTimeout(()=>h.classList.remove('show'),90)}if(game.bots.every(b=>!b.alive))roundOver(true)}
function reload(){if(game.reserve<=0||game.ammo===30)return;let n=Math.min(30-game.ammo,game.reserve);game.ammo+=n;game.reserve-=n;updateHud();notice('RECARREGANDO')}
function updateHud(){document.getElementById('hp').textContent=Math.max(0,Math.ceil(game.hp));document.getElementById('hpfill').style.width=Math.max(0,game.hp)+'%';document.getElementById('ammo').textContent=game.ammo;document.querySelector('.ammo span').textContent=' / '+game.reserve;document.getElementById('money').textContent='$'+game.money;document.getElementById('time').textContent=Math.ceil(game.time/60)+':'+String(Math.ceil(game.time%60)).padStart(2,'0');document.getElementById('round').textContent='ROUND '+game.round+' / 13'}
function roundOver(win){if(!game.running)return;game.running=false;game.round++;game.money+=win?3250:1900;notice(win?'VANGUARD WINS':'AEGIS WINS');setTimeout(()=>{game.running=true;game.hp=100;game.time=95;game.ammo=30;game.reserve=90;player.x=0;player.y=0;resetBots();updateHud()},2600)}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);drawWorld();drawMap();updateHud();requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.getElementById('play').onclick=()=>{document.getElementById('start').classList.add('hide');game.running=true;notice('ROUND 1')};document.getElementById('reload').onclick=reload;document.getElementById('plant').onclick=()=>{if(Math.hypot(player.x+5,player.y+9)<4){notice('C-4 PLANTADO');game.time=35}else notice('MOVA-SE PARA O PONTO A')};
let stick={active:false,dx:0,dy:0};const se=document.getElementById('stick'),kn=document.getElementById('knob');function stickPos(e){let r=se.getBoundingClientRect(),p=(e.touches ? e.touches[0] : null)||e,x=p.clientX-r.left-55,y=p.clientY-r.top-55,l=Math.hypot(x,y),m=Math.min(38,l||1);stick.dx=x/(l||1)*m/38;stick.dy=y/(l||1)*m/38;kn.style.transform=`translate(${stick.dx*38}px,${stick.dy*38}px)`}se.addEventListener('touchstart',e=>{stick.active=true;stickPos(e)},{passive:false});se.addEventListener('touchmove',e=>{e.preventDefault();stickPos(e)},{passive:false});se.addEventListener('touchend',()=>{stick.active=false;stick.dx=stick.dy=0;kn.style.transform=''});
let touchFire=false;const fire=document.getElementById('fire');fire.addEventListener('touchstart',()=>touchFire=true,{passive:false});fire.addEventListener('touchend',()=>touchFire=false,{passive:false});let look={active:false,x:0};canvas.addEventListener('touchstart',e=>{if(game.mobile){look.active=true;look.x=e.touches[0].clientX}}, {passive:false});canvas.addEventListener('touchmove',e=>{if(look.active){let x=e.touches[0].clientX;game.yaw+=(look.x-x)*.006;look.x=x;e.preventDefault()}},{passive:false});canvas.addEventListener('touchend',()=>look.active=false);
addEventListener('beforeunload',()=>{});
</script>
</body>
</html>
