const glowPads=[];for(let i=0;i<18;i++){const a=i/18*Math.PI*2;const p=new THREE.Mesh(new THREE.SphereGeometry(.08,16,12),new THREE.MeshBasicMaterial({color:i%2? '#ff80bf':'#80f3dd'}));p.position.set(Math.cos(a)*4.2,1.4+Math.sin(a*2)*.9,-0.5+Math.sin(a)*2);scene.add(p);glowPads.push(p)}
let bpm=112,score=0,combo=0,soundOn=false,audioCtx=null,drag=false,lastX=0,rot=0,targetRot=0,zoom=7.7;const clock=new THREE.Clock();let elapsed=0,hitPulse=0;const scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),toast=document.getElementById('toast'),bar=document.getElementById('beatbar');

function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;const beatLen=60/bpm,phase=(elapsed%beatLen)/beatLen;bar.style.transform=`translateX(${phase*330-100}%)`;
