function danceHit(){const period=60/bpm,phase=((elapsed%period)/period),offset=Math.min(phase,1-phase)*period;let quality=offset<.09?'PERFEITO!':offset<.17?'NO RITMO!':'BOA!';const points=offset<.09?100:offset<.17?65:25;combo++;score+=points+Math.min(combo*2,50);scoreEl.textContent=String(score).padStart(4,'0');comboEl.textContent='COMBO ×'+combo;toast.textContent=quality;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),430);hitPulse=1;ping(quality==='PERFEITO!'?740:540,.12);if(combo%5===0)ping(980,.18)}
document.getElementById('hit').addEventListener('click',danceHit);window.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();danceHit()}});
document.getElementById('tempo').onclick=()=>{bpm=bpm>=148?88:bpm+10;document.getElementById('bpm').textContent=bpm};document.getElementById('sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'♫ SOM: ON':'♪ SOM: OFF';ping(660)};
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(drag){targetRot+=(e.clientX-lastX)*.006;lastX=e.clientX}});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);renderer.domElement.addEventListener('wheel',e=>{zoom=THREE.MathUtils.clamp(zoom+e.deltaY*.008,7,20);zoomSlider.value=zoom;zoomValue.textContent=zoom.toFixed(1)} ,{passive:true});
const zoomSlider=document.getElementById('cameraZoom'),zoomValue=document.getElementById('zoomValue');zoomSlider.addEventListener('input',()=>{zoom=Number(zoomSlider.value);zoomValue.textContent=zoom.toFixed(1)});
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;const beatLen=60/bpm,phase=(elapsed%beatLen)/beatLen;bar.style.transform=`translateX(${phase*330-100}%)`;
 const wave=Math.sin(elapsed*Math.PI*2*(bpm/60));const sway=Math.sin(elapsed*2.25);const bounce=Math.abs(wave);const bootyWiggle=Math.sin(elapsed*7.5)*.2;
 body.position.y=.18 + Math.abs(wave)*.18 + hitPulse*.08;
 body.rotation.z=sway*.08;
 body.rotation.y=Math.sin(elapsed*1.3)*.18;
 const partnerBeat=Math.sin(elapsed*Math.PI*2*(bpm/60)+.7),partnerBounce=Math.abs(partnerBeat),partnerWiggle=Math.sin(elapsed*7.5);partner.position.y=-.15+partnerBounce*.17+hitPulse*.06;
 partner.rotation.z=Math.sin(elapsed*2.1+.8)*.055;
 partner.rotation.y=Math.sin(elapsed*1.15+.6)*.14;
 partnerLeftArm.rotation.z=-.62+Math.sin(elapsed*3.1)*.08;
 partnerRightArm.rotation.z=.62-Math.sin(elapsed*3.1+.8)*.08;
 partnerLeftHand.rotation.z=Math.sin(elapsed*3.1)*.12;partnerRightHand.rotation.z=-Math.sin(elapsed*3.1+.8)*.12;
 partnerLeftLeg.rotation.x=.08*Math.sin(elapsed*3.5+.5);
 partnerRightLeg.rotation.x=-.08*Math.sin(elapsed*3.5+.5);
 partnerLeftHip.scale.x=.56+partnerBounce*.07;partnerRightHip.scale.x=.56+partnerBounce*.07;
 partnerLeftGlute.scale.x=.59+Math.abs(partnerWiggle)*.13;partnerRightGlute.scale.x=.59+Math.abs(partnerWiggle)*.13;
 partnerLeftGlute.scale.y=.78+partnerBounce*.1;partnerRightGlute.scale.y=.78+partnerBounce*.1;
 partnerLeftGlute.position.y=1.03+partnerWiggle*.07;partnerRightGlute.position.y=1.03-partnerWiggle*.07;
 partnerHead.rotation.z=Math.sin(elapsed*2.5+.4)*.045;
 leftEar.rotation.z=-.25+Math.sin(elapsed*3.2)*.07;rightEar.rotation.z=.25+Math.sin(elapsed*3.2+.5)*.07;
 leftHip.rotation.z=0.12+bootyWiggle; rightHip.rotation.z=-0.12-bootyWiggle;
 leftButt.scale.x=1.02+Math.abs(wave)*.16; rightButt.scale.x=1.02+Math.abs(wave)*.16; leftButt.scale.y=1.18+Math.abs(wave)*.12; rightButt.scale.y=1.18+Math.abs(wave)*.12;
 leftLeg.rotation.x=.04*Math.sin(elapsed*3.5); rightLeg.rotation.x=-.04*Math.sin(elapsed*3.5);
 leftCalf.rotation.x=.1*Math.sin(elapsed*3.5+1.1); rightCalf.rotation.x=-.1*Math.sin(elapsed*3.5+1.1);
 head.rotation.z=Math.sin(elapsed*2.7)*.06;
 for(const p of glowPads){p.position.y=1.1+Math.sin(elapsed*2.2+p.position.x)*.8;}
 hitPulse=Math.max(0,hitPulse-dt*2.8);rot+=(targetRot-rot)*.08;orbitAngle+=dt*.11;const cameraAngle=orbitAngle+rot;camera.position.set(Math.sin(cameraAngle)*zoom,2.7,Math.cos(cameraAngle)*zoom);camera.lookAt(.1,1.05,0);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<600?48:36;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
</script>
