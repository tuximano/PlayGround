;height:100%;width:30%;border-radius:9px;background:linear-gradient(90deg,var(--cyan),var(--pink));transform:translateX(-100%)}.toast{position:absolute;top:24%;left:50%;transform:translate(-50%,-50%) scale(.8);z-index:3;font-size:clamp(26px,5vw,52px);font-weight:900;letter-spacing:-.05em;color:var(--gold);text-shadow:0 4px 20px #ff4fa366;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.bpm{font:500 10px 'DM Mono',monospace;color:#d7d2ea;letter-spacing:.12em}.notice{position:absolute;left:50%;bottom:108px;transform:translateX(-50%);white-space:nowrap;color:#f2efff88;font-size:10px;letter-spacing:.1em;pointer-events:none}@media(max-width:600px){.brand p{max-width:180px}.bottom{align-items:flex-end}.hint{max-width:130px}.controls{gap:7px}.hit{padding:12px 14px}.control{padding:9px}.notice{bottom:100px}.scorebox{min-width:94px;padding:8px 10px}.score{font-size:24px}}

<body>
<div class="ui">
 <div class="top">

<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color('#171431');scene.fog=new THREE.Fog('#171431',8,20);
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,80);camera.position.set(0,2.4,8.2);camera.lookAt(0,1.45,0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb9c9ff,0x211432,2));
function area(color,intensity,pos){const l=new THREE.PointLight(color,intensity,16,2);l.position.set(...pos);scene.add(l)}area('#ff4fa3',65,[-3,4,3]);area('#53f4e3',75,[3,3,-2]);area('#ffcb6b',40,[0,5,4]);
const mat=(color,rough=.65,metal=0)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
const skin=mat('#d58c64'),shorts=mat('#6447de',.32),stitch=mat('#a99aff',.5),topmat=mat('#29cbbb',.38),sole=mat('#f9f2ff',.4),shoe=mat('#ff4f99',.38),dark=mat('#332545');
const root=new THREE.Group();scene.add(root);
function blob(parent,color,pos,scale,material){const m=new THREE.Mesh(new THREE.SphereGeometry(1,32,24),material||mat(color));m.position.set(...pos);m.scale.set(...scale);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function tube(parent,pts,radius,color){const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)));const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,48,radius,8,false),mat(color,.48));mesh.castShadow=true;parent.add(mesh);return mesh}
// Legs and trainers
const legs=[];for(const s of [-1,1]){const leg=new THREE.Group();leg.position.set(s*.48,.7,0);root.add(leg);blob(leg,'#d58c64',[0,-.55,0],[.30,.82,.31],skin);blob(leg,'#d58c64',[0,-1.13,.08],[.31,.30,.34],skin);const trainer=new THREE.Group();trainer.position.set(0,-1.34,.16);leg.add(trainer);blob(trainer,'#ff4f99',[0,0,0],[.34,.19,.53],shoe);blob(trainer,'#f9f2ff',[0,-.12,.04],[.36,.09,.55],sole);for(let i=0;i<3;i++)tube(trainer,[[-.12+i*.09,.11,.08],[-.10+i*.09,.14,.24]],.012,'#fff3fa');legs.push(leg)}
// Waist, hips and fitted dance shorts
const waist=new THREE.Group();waist.position.set(0,1.27,0);root.add(waist);
blob(waist,'#d58c64',[0,.03,0],[.79,.55,.42],skin);
blob(waist,'#6447de',[0,-.08,0],[.85,.57,.46],shorts);
// distinct fabric panels, piping and waistband
const band=blob(waist,'#ffda69',[0,.36,0],[.81,.105,.445],mat('#ffda69',.4));
for(const s of [-1,1]){
  const cheek=blob(waist,'#6447de',[s*.36,-.09,.24],[.45,.43,.30],shorts);cheek.rotation.z=s*-.10;
  tube(waist,[[s*.02,.27,.39],[s*.23,.24,.47],[s*.50,.15,.42],[s*.69,.02,.31]],.014,'#b9adff');
}
tube(waist,[[0,.28,.45],[0,.05,.535],[0,-.18,.50],[0,-.34,.38]],.017,'#392c9c');
// Sleeveless cropped dance top and shoulders
const torso=new THREE.Group();torso.position.set(0,1.62,0);root.add(torso);
blob(torso,'#d58c64',[0,.20,0],[.59,.66,.34],skin);
blob(torso,'#29cbbb',[0,.45,-.005],[.66,.47,.37],topmat);
for(const s of [-1,1]){blob(torso,'#29cbbb',[s*.52,.55,0],[.19,.25,.24],topmat);blob(torso,'#d58c64',[s*.72,.20,0],[.20,.46,.21],skin)}
blob(torso,'#54f4e3',[0,.11,.005],[.60,.075,.36],mat('#54f4e3',.42));
// Floor and glowing dance stage
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),mat('#19152e',.8));floor.rotation.x=-Math.PI/2;floor.position.y=-.83;floor.receiveShadow=true;scene.add(floor);
const stage=new THREE.Mesh(new THREE.CylinderGeometry(2.35,2.5,.20,64),mat('#30235a',.35,.3));stage.position.y=-.78;stage.receiveShadow=true;stage.castShadow=true;scene.add(stage);
const ring=new THREE.Mesh(new THREE.TorusGeometry(2.23,.035,10,100),new THREE.MeshBasicMaterial({color:'#54f4e3'}));ring.rotation.x=Math.PI/2;ring.position.y=-.66;scene.add(ring);
const grid=new THREE.GridHelper(40,40,'#3b2e68','#272044');grid.position.y=-.665;scene.add(grid);
// Colorful floating lights and back panels
for(let i=0;i<20;i++){const a=i/20*Math.PI*2;const light=new THREE.Mesh(new THREE.SphereGeometry(.055,12,10),new THREE.MeshBasicMaterial({color:i%2?'#ff4fa3':'#54f4e3'}));light.position.set(Math.cos(a)*3.1,.15+Math.random()*2.2,-1.1+Math.sin(a)*.5);scene.add(light)}
const spot=new THREE.SpotLight('#ffffff',85,18,Math.PI/5,.55,1);spot.position.set(-1,7,3);spot.target.position.set(0,1,0);spot.castShadow=true;spot.shadow.mapSize.set(1024,1024);scene.add(spot,spot.target);
// Subtle stars in the backdrop
const stars=new THREE.BufferGeometry(),starPos=[];for(let i=0;i<180;i++)starPos.push((Math.random()-.5)*18,Math.random()*8-1,-4-Math.random()*8);stars.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));scene.add(new THREE.Points(stars,new THREE.PointsMaterial({color:'#c7c1ff',size:.025,transparent:true,opacity:.65})));
let bpm=112,score=0,combo=0,lastBeat=-1,soundOn=false,audioCtx=null,drag=false,lastX=0,rot=0,targetRot=0,zoom=8.2;const clock=new THREE.Clock();let elapsed=0,hitPulse=0;const scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),toast=document.getElementById('toast'),bar=document.getElementById('beatbar');
function ping(freq=500,dur=.08){if(!soundOn)return;try{audioCtx ||=new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.08,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
function danceHit(){const period=60/bpm,phase=((elapsed%period)/period),offset=Math.min(phase,1-phase)*period;let quality=offset<.09?'PERFEITO!':offset<.17?'NO RITMO!':'BOA!';const points=offset<.09?100:offset<.17?65:25;combo++;score+=points+Math.min(combo*2,50);scoreEl.textContent=String(score).padStart(4,'0');comboEl.textContent='COMBO ×'+combo;toast.textContent=quality;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),430);hitPulse=1;ping(quality==='PERFEITO!'?740:540,.12);if(combo%5===0)ping(980,.18)}
document.getElementById('hit').addEventListener('click',danceHit);window.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();danceHit()}});
document.getElementById('tempo').onclick=()=>{bpm=bpm>=148?88:bpm+10;document.getElementById('bpm').textContent=bpm};document.getElementById('sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'♫ SOM: ON':'♪ SOM: OFF';ping(660)};
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(drag){targetRot+=(e.clientX-lastX)*.006;lastX=e.clientX}});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('wheel',e=>{zoom=THREE.MathUtils.clamp(zoom+e.deltaY*.008,6,11)});
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;const beatLen=60/bpm,phase=(elapsed%beatLen)/beatLen;bar.style.transform=`translateX(${phase*330-100}%)`;
 const wave=Math.sin(elapsed*Math.PI*2*(bpm/60));const quick=Math.sin(elapsed*Math.PI*4*(bpm/60));const kick=Math.max(0,1-phase*4);
 waist.position.y=1.27+.045*Math.abs(wave)+hitPulse*.08;waist.rotation.y=Math.sin(elapsed*3.3)*.10+quick*.035;waist.rotation.z=Math.sin(elapsed*2.7)*.055;waist.scale.z=1+Math.abs(wave)*.035+hitPulse*.06;
 torso.rotation.z=Math.sin(elapsed*2.7+.5)*.045;torso.rotation.y=-waist.rotation.y*.55;root.position.y=.035*Math.sin(elapsed*Math.PI*2*(bpm/60))+.035+hitPulse*.07;
 legs[0].rotation.z=.055*Math.sin(elapsed*2.7);legs[1].rotation.z=-.055*Math.sin(elapsed*2.7);legs[0].rotation.x=.045*Math.sin(elapsed*4);legs[1].rotation.x=-.045*Math.sin(elapsed*4);
 hitPulse=Math.max(0,hitPulse-dt*2.8);rot+=(targetRot-rot)*.08;camera.position.x=Math.sin(rot)*zoom*.10;camera.position.z=zoom;camera.lookAt(0,1.15,0);camera.position.z=zoom;renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
